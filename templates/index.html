<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Interview Coach</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at top, #161c2c 0%, #0f1420 60%);
        }
        .landing-icon {
            font-size: 48px;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .landing h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .landing p {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 480px;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .landing-buttons { display: flex; gap: 14px; }
        .landing-buttons a {
            padding: 13px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-primary { background: var(--accent); color: #0f1420; }
        .btn-primary:hover { background: #5eead4; box-shadow: 0 6px 20px var(--accent-glow); transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        .landing-features {
            display: flex;
            gap: 20px;
            margin-top: 56px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .feature-chip {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-chip i { color: var(--accent); }
    </style>
</head>
<body>
    <div class="landing">
        <div class="landing-icon"><i class="fa-solid fa-brain"></i></div>
        <h1>AI Interview Coach</h1>
        <p>Prepare for your next job interview with AI-generated questions, instant answer evaluation, and a personalized readiness report.</p>

        <div class="landing-buttons">
            <a href="{{ url_for('auth.login') }}" class="btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
            <a href="{{ url_for('auth.register') }}" class="btn-secondary"><i class="fa-solid fa-user-plus"></i> Register</a>
        </div>

        <div class="landing-features">
            <div class="feature-chip"><i class="fa-solid fa-robot"></i> AI-Generated Questions</div>
            <div class="feature-chip"><i class="fa-solid fa-chart-line"></i> Instant Feedback</div>
            <div class="feature-chip"><i class="fa-solid fa-file-arrow-up"></i> Resume Personalization</div>
            <div class="feature-chip"><i class="fa-solid fa-gauge"></i> Readiness Score</div>
        </div>
    </div>
</body>
</html>
